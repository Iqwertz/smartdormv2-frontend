stages:
  - build
  - deploy

.build_template: &build_definition
  stage: build
  image: node:18 # Use a Node.js image
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Building with VITE_API_BASE_URL=${VITE_API_BASE_URL}"
    - echo "VITE_API_BASE_URL=${VITE_API_BASE_URL}" > .env
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

build_development:
  <<: *build_definition
  environment:
    name: development
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

build_production:
  <<: *build_definition
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

.deploy_template: &deploy_definition
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to ${CI_ENVIRONMENT_NAME} server..."
    # Use rsync to efficiently copy the built files to the server's web root
    - rsync -avz --delete dist/ ${SERVER_USER}@${SERVER_IP}:/var/www/smartdorm-frontend/html/

deploy_to_development:
  extends: .deploy_template
  environment:
    name: development
  needs: [build_development]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy_to_production:
  extends: .deploy_template
  environment:
    name: production
  needs: [build_production]
  when: manual
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_STATE == "merged"'
