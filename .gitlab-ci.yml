stages:
  - build

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  paths:
    - .npm/
    - node_modules/

build:
  stage: build
  tags:
    - shell
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
    - cp dist /var/www/html
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - merge_requests
    - main
